services:
  - type: web
    name: tuesday-com
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /data
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
